spring:
  main:
    allow-bean-definition-overriding: true
  docker:
    compose:
      file: ../compose.yaml
      skip:
        in-tests: false

worker:
  retry:
    base-delay: 0s
    max-delay: 0s
    max-retries: 3

jwt:
  secret: TestTestTestTestTestTestTestTestTestTestTest
  cookie-name: TEST_AUTH_TOKEN
  cookie-path: /
  cookie-secure: false
  cookie-same-site: Lax
